<style>
  :root { --bg: #0b1412; --cream: #f1ead6; --dim: #a9b3a0; --ink: #0d1110; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--cream); }
  body { font-family: "Inter", ui-sans-serif, system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }

  #stage { position: fixed; inset: 0; overflow: hidden; }
  #scene { width: 100%; height: 100%; display: block; overflow: visible; }
  @media (max-aspect-ratio: 6/5) {
    #stage { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    #stage::-webkit-scrollbar { display: none; }
    #scene { width: 165vh; height: 100%; }
    .title h1 { font-size: 24px; }
    .title p { font-size: 12px; background: rgba(11,20,18,.6); padding: 2px 6px; border-radius: 6px; margin-left: -6px; }
    .hint .wide { display: none; }
    .hint .narrow { display: inline; }
  }
  .hint .narrow { display: none; }

  .ink { stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .thin { stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  .door, .deco { cursor: pointer; outline: none; }
  .door > g, .deco > g { transition: filter .25s, transform .25s; transform-box: fill-box; transform-origin: 50% 100%; }
  .door:hover > g, .door:focus-visible > g { filter: drop-shadow(0 0 10px rgba(190, 255, 200, .7)) brightness(1.15); transform: translateY(-3px); }
  .deco:hover > g, .deco:focus-visible > g { filter: drop-shadow(0 0 7px rgba(240, 255, 220, .5)) brightness(1.1); }
  .tag text { font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 12px; font-weight: 600; fill: #23301f; }
  .door:hover .tag rect { fill: #fffbe8; }

  .sway { animation: sway 6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  .swayTop { animation: sway 5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 0%; }
  @keyframes sway { from { transform: rotate(-1.5deg); } to { transform: rotate(1.6deg); } }
  .glow { animation: glow 3.2s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  .twinkle { animation: glow 2.2s ease-in-out infinite; }
  .puff { animation: puff 4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes puff { 0% { transform: translate(0, 0) scale(.4); opacity: 0; } 15% { opacity: .85; } 100% { transform: translate(14px, -70px) scale(1.5); opacity: 0; } }
  .note { animation: note 3.6s ease-out infinite; }
  @keyframes note { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(-30px, -80px); opacity: 0; } }
  .flow { stroke-dasharray: 14 10; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -24; } }
  .drop { animation: drop linear infinite; }
  @keyframes drop { from { transform: translateY(-40px); opacity: 0; } 10% { opacity: .5; } to { transform: translateY(460px); opacity: 0; } }
  .snap { transition: transform .18s ease-in; }
  .deco.flytrap:hover .jawL { transform: rotate(24deg); }
  .deco.flytrap:hover .jawR { transform: rotate(-24deg); }

  .title { position: fixed; left: clamp(14px, 2.4vw, 34px); top: clamp(12px, 2.2vw, 30px); z-index: 5; pointer-events: none; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  .title a { pointer-events: auto; color: var(--dim); text-decoration: none; font-size: 13px; }
  .title a:hover { color: var(--cream); }
  .title h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(26px, 3.4vw, 46px); line-height: 1; margin-top: 6px; }
  .title p { margin-top: 8px; color: var(--dim); font-size: clamp(12px, 1.05vw, 15px); max-width: 32ch; line-height: 1.45; }
  .title p em { font-family: "Fraunces", Georgia, serif; color: var(--cream); }

  #listBtn { position: fixed; right: clamp(12px, 2vw, 28px); top: clamp(12px, 2vw, 26px); z-index: 6; background: rgba(14,26,22,.78); color: var(--cream); border: 1px solid rgba(170,220,170,.4); border-radius: 999px; padding: 8px 14px; font: 600 13px "Inter", sans-serif; cursor: pointer; backdrop-filter: blur(6px); }
  #listBtn:hover { border-color: #bfe8b0; }
  #list { position: fixed; right: clamp(12px, 2vw, 28px); top: 62px; max-height: calc(100% - 80px); overflow-y: auto; z-index: 6; background: rgba(12,22,19,.95); border: 1px solid rgba(170,220,170,.3); border-radius: 14px; padding: 10px; display: none; width: min(340px, calc(100vw - 24px)); box-shadow: 0 18px 50px rgba(0,0,0,.6); }
  #list.open { display: block; }
  #list h3 { font: 600 11px "Inter", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #8fb38a; padding: 10px 12px 4px; }
  #list a { display: block; padding: 8px 12px; border-radius: 9px; color: var(--cream); text-decoration: none; }
  #list a:hover { background: rgba(170,220,170,.12); }
  #list a small { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
  #list span.soon { display: block; padding: 8px 12px; color: var(--dim); }

  #tip { position: fixed; z-index: 7; pointer-events: none; background: rgba(12,22,19,.94); border: 1px solid rgba(170,220,170,.45); border-radius: 10px; padding: 7px 11px; font-size: 13px; opacity: 0; transform: translate(-50%, -130%); transition: opacity .15s; max-width: 320px; }
  #tip b { font-family: "Fraunces", Georgia, serif; font-size: 15px; color: #d8f5b8; font-weight: 600; }
  #tip span { color: var(--dim); display: block; margin-top: 2px; }
  #tip.on { opacity: 1; }

  #pane { position: fixed; z-index: 8; left: clamp(12px, 2.4vw, 34px); bottom: clamp(12px, 2.4vw, 34px); width: min(360px, calc(100vw - 24px)); background: linear-gradient(#18261f, #101a16); border: 1px solid rgba(170,220,170,.45); border-radius: 16px; padding: 16px 18px 18px; box-shadow: 0 24px 60px rgba(0,0,0,.65); transform: translateY(14px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  #pane.open { opacity: 1; transform: none; pointer-events: auto; }
  #pane h2 { font-family: "Fraunces", Georgia, serif; font-size: 22px; font-weight: 600; color: #d8f5b8; padding-right: 26px; }
  #pane .latin { font-family: "Fraunces", Georgia, serif; font-style: italic; color: var(--dim); font-size: 14px; margin-top: 2px; }
  #pane p { margin-top: 10px; font-size: 14px; line-height: 1.55; color: #e4e9d8; }
  #pane .x { position: absolute; right: 12px; top: 10px; background: none; border: 0; color: var(--dim); font-size: 22px; cursor: pointer; }

  .hint { position: fixed; right: clamp(12px, 2vw, 28px); bottom: clamp(10px, 1.6vw, 22px); z-index: 4; color: rgba(241,234,214,.5); font-size: 12px; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .sway, .swayTop, .glow, .twinkle, .puff, .note, .flow, .drop { animation: none; } }
</style>

const foiler = $("foiler"), wave = $("troughWave");
let T = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  const u = (T * .12) % 2, dir = u < 1 ? 1 : -1, s = u < 1 ? u : 2 - u;
  const fx = 422 + s * 146, fy = 600 + Math.sin(T * 3) * 2;
  foiler.setAttribute("transform", `translate(${fx.toFixed(1)} ${fy.toFixed(1)}) scale(${dir} 1)`);
  let d = "M400 646 V612";
  for (let x = 400; x <= 590; x += 10) d += ` L${x} ${(610 + Math.sin(x * .08 + T * 3) * 2).toFixed(1)}`;
  wave.setAttribute("d", d + " V646z");
  for (const f of flies) { f.p += dt; f.e.setAttribute("cx", (f.x + Math.sin(f.p * .7) * 40).toFixed(1)); f.e.setAttribute("cy", (f.y + Math.sin(f.p * 1.1) * 26).toFixed(1)); f.e.setAttribute("opacity", (.4 + .6 * Math.max(0, Math.sin(f.p * 2))).toFixed(2)); }
  if (!reduced) requestAnimationFrame(frame);
}

    tip.classList.add("on");
  });
  a.addEventListener("pointerleave", () => tip.classList.remove("on"));
});
addEventListener("pointermove", e => { tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; });
function openPane(key) {
  const i = INFO[key];
  pane.querySelector("h2").textContent = i.t; pane.querySelector(".latin").textContent = i.l; pane.querySelector("p").textContent = i.p;
  pane.classList.add("open");
}
document.querySelectorAll(".deco").forEach(a => {
  a.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); openPane(a.dataset.info); });
  a.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openPane(a.dataset.info); } });
});
pane.querySelector(".x").addEventListener("click", () => pane.classList.remove("open"));
$("stage").addEventListener("click", e => { if (!e.target.closest(".deco")) pane.classList.remove("open"); });
const list = $("list"), listBtn = $("listBtn");
listBtn.addEventListener("click", () => { const o = list.classList.toggle("open"); listBtn.setAttribute("aria-expanded", o); });
addEventListener("keydown", e => { if (e.key === "Escape") { pane.classList.remove("open"); list.classList.remove("open"); } });
const stage = $("stage");
if (stage.scrollWidth > stage.clientWidth) stage.scrollLeft = (stage.scrollWidth - stage.clientWidth) * .5;
</script>
</body>
</html>
