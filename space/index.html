<html lang="en">

<title>space · lab.corentinbel.com</title>
<meta name="description" content="How small we are — a continuous log-zoom from a human hand to the observable universe. True sizes, true distances.">
<style>
  :root {
    --bg:#07080c; --fg:#e8e6df; --dim:#8a8fa3; --accent:#6ea8ff; --teal:#8ceedd;
    --border:#232b3a; --glass:rgba(13,16,24,.72);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;
    overflow:hidden; overscroll-behavior:none;
  }
  canvas#c { position:fixed; inset:0; display:block; touch-action:none; cursor:ns-resize; }

  header {
    position:fixed; top:0; left:0; right:0; z-index:4;
    display:flex; justify-content:space-between; align-items:baseline;
    padding:1.2rem 1.6rem; pointer-events:none;
  }
  header a { pointer-events:auto; color:var(--dim); text-decoration:none; font-size:.85rem; margin-left:1.1rem; }
  header a:hover { color:var(--accent); }
  h1 { font-weight:300; font-size:1.25rem; letter-spacing:.06em; }
  h1 b { font-weight:600; }
  h1 span { color:var(--dim); font-size:.85rem; letter-spacing:.03em; }

  #hud {
    position:fixed; left:1.6rem; top:5.2rem; z-index:3; pointer-events:none;
    max-width:min(340px, 62vw);
  }
  #hud-scale {
    font-size:clamp(1.7rem, 4.5vw, 2.5rem); font-weight:200; letter-spacing:.02em;

  }
  #hud-unit { margin-top:.25rem; font-size:.82rem; color:var(--teal); }
  #hud-cmp  { margin-top:.35rem; font-size:.92rem; color:var(--dim); font-style:italic; }
  #hud-you {
    margin-top:.9rem; display:inline-block;
    font-size:.78rem; color:var(--accent);
    background:var(--glass); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid var(--border); border-radius:12px; padding:.35rem .65rem;
  }

  #caption {
    position:fixed; left:50%; top:22%; transform:translateX(-50%);
    z-index:3; pointer-events:none; opacity:0;
    width:min(640px, 86vw); text-align:center;
    font-size:clamp(.95rem, 2.4vw, 1.15rem); font-weight:300; letter-spacing:.02em;
    color:var(--fg); text-shadow:0 0 18px rgba(140,238,221,.35), 0 2px 14px rgba(0,0,0,.8);
  }

  #zoomer {
    position:fixed; bottom:calc(1rem + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    z-index:4; width:min(720px, 90vw);

    border:1px solid var(--border); border-radius:12px;
    padding:.85rem 1.1rem 1.5rem; user-select:none; -webkit-user-select:none;
  }
  #hint { font-size:.72rem; color:#4a4f61; text-align:center; margin-bottom:.55rem; transition:opacity 1.2s ease; }
  #track {
    position:relative; height:22px; cursor:pointer; touch-action:none;
  }
  #rail { position:absolute; left:0; right:0; top:10px; height:2px; background:var(--border); border-radius:1px; }
  #fill { position:absolute; left:0; top:10px; height:2px; width:0; border-radius:1px;
          background:linear-gradient(90deg, var(--accent), var(--teal)); opacity:.8; }
  .tick { position:absolute; top:7px; width:1px; height:8px; background:#2c3550; }
  .tick.major { top:5px; height:12px; background:#3d4a6b; }
  .tlabel {
    position:absolute; top:22px; transform:translateX(-50%);

  }
  #thumb {
    position:absolute; top:11px; width:15px; height:15px; border-radius:50%;
    transform:translate(-50%,-50%); background:var(--accent);
    box-shadow:0 0 10px rgba(110,168,255,.8), 0 0 26px rgba(110,168,255,.4);
    pointer-events:none;
  }
  @media (max-width:640px) {
    header { padding:.9rem 1rem; }
    header a { margin-left:.8rem; }
    #hud { left:1rem; top:4.2rem; }
    #zoomer { padding:.7rem .8rem 1.4rem; }
    .tlabel { font-size:.56rem; }
  }
</style>

<body>
<canvas id="c"></canvas>

<header>
  <h1><b>space</b> <span>· lab.corentinbel.com</span></h1>
  <nav>
    <a href="https://lab.corentinbel.com">← lab</a>

  </nav>

<div id="hud">
  <div id="hud-scale"></div>
  <div id="hud-unit"></div>

  <div id="hud-you"></div>
</div>

<div id="caption"></div>

<div id="zoomer">
  <div id="hint">scroll · pinch · drag — or ride the slider</div>
  <div id="track">
    <div id="rail"></div>
    <div id="fill"></div>
    <div id="thumb"></div>
  </div>
</div>

<script>
'use strict';

/* ---------------------------------------------------------- constants */
const C_LIGHT = 299792458;            // m/s
const LY  = 9.4607e15;                // m
const AU  = 1.496e11;                 // m
const LOG_MIN = -1, LOG_MAX = 27;     // 10^-1 m .. 10^27 m per screen-height

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const elScale = document.getElementById('hud-scale');
const elUnit  = document.getElementById('hud-unit');
const elCmp   = document.getElementById('hud-cmp');
const elYou   = document.getElementById('hud-you');
const elCap   = document.getElementById('caption');
const elHint  = document.getElementById('hint');
const elTrack = document.getElementById('track');
const elFill  = document.getElementById('fill');
const elThumb = document.getElementById('thumb');

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---------------------------------------------------------- camera */
let logS = 0.35;          // displayed log10(meters per screen-height)
let target = 0.35;        // where we are lerping to
let prevLogS = logS;

const clampLog = v => Math.max(LOG_MIN, Math.min(LOG_MAX, v));

/* ---------------------------------------------------------- objects
   Size regime: real heights/diameters, standing on a baseline.
   Distance regime: real distances from Earth along a line, drawn at
   true angular size (floored at a couple of px). All values real. */
const SIZE_OBJECTS = [
  { name:'a hand',        size:0.10,     x:0.50, color:'#e8e6df', fact:'≈ 10 cm — where this journey starts' },
  { name:'you',           size:1.8,      x:0.38, color:'#6ea8ff', human:true, fact:'1.8 m — everything below is measured against you' },
  { name:'blue whale',    size:30,       x:0.60, color:'#8ceedd', fact:'up to 30 m — the largest animal that has ever lived' },
  { name:'Eiffel Tower',  size:330,      x:0.42, color:'#e8e6df', fact:'330 m — world’s tallest structure for 41 years' },
  { name:'Burj Khalifa',  size:828,      x:0.63, color:'#8a8fa3', fact:'828 m — the tallest thing our species has built' },
  { name:'Mount Everest', size:8849,     x:0.52, color:'#cfd6ea', fact:'8,849 m — airliners cruise barely above its summit' },
  { name:'a neutron star',size:2.0e4,    x:0.40, color:'#8ceedd', fact:'~20 km across, yet heavier than the Sun' },
  { name:'Ceres',         size:9.4e5,    x:0.62, color:'#8a8fa3', fact:'940 km — the largest object in the asteroid belt' },
  { name:'Earth',         size:1.2742e7, x:0.50, color:'#6ea8ff', fact:'12,742 km — every human who ever lived, lived here' },
];

const DIST_OBJECTS = [
  { name:'Moon',            d:3.844e8,  r:1.737e6,  color:'#cfd3dc', side:-1, fact:'the farthest any human has ever travelled' },
  { name:'Mars (closest)',  d:5.5e10,   r:3.39e6,   color:'#ff8a66', side: 1, fact:'at closest approach — still a 6-month trip' },
  { name:'Sun',             d:1.496e11, r:6.96e8,   color:'#ffd27a', side:-1, fact:'the light hitting you now left it 8 minutes ago' },
  { name:'Jupiter (closest)',d:5.9e11,  r:6.99e7,   color:'#e8c9a0', side: 1, fact:'all the other planets would fit inside it' },
  { name:'Voyager 1',       d:2.4e13,   r:0,        color:'#8ceedd', side:-1, fact:'our farthest machine, flying since 1977' },
  { name:'Proxima Centauri',d:4.017e16, r:1.07e8,   color:'#ffb3a0', side: 1, fact:'the nearest star after the Sun' },
  { name:'Milky Way centre',d:2.46e20,  r:0,        color:'#ffd27a', side:-1, fact:'Sagittarius A*, a 4-million-solar-mass black hole' },
  { name:'Andromeda',       d:2.4e22,   r:1.04e21,  color:'#b9c6ff', side: 1, fact:'on a slow collision course with the Milky Way' },
  { name:'Virgo Cluster',   d:5.1e23,   r:0,        color:'#8ceedd', side:-1, fact:'~1,500 galaxies in one gravitational knot' },
  { name:'edge of the observable universe', d:4.4e26, r:0, color:'#e8e6df', side:1,
    fact:'46.5 billion light-years away', lightNote:'its light set out 13.8 billion years ago' },
];

/* one comparison line per decade of scale (index = floor(logS)+1) */
const DECADE_CMP = [
  'the width of your hand',                       // 10^-1
  'a doorway — human scale',                      // 10^0
  'a blue whale, nose to tail',                   // 10^1
  'a football pitch',                             // 10^2
  'a fifteen-minute walk',                        // 10^3
  'Mount Everest would just fit',                 // 10^4
  'Paris to Orléans',                             // 10^5
  'France, top to bottom',                        // 10^6
  'the Earth, with room to spare',                // 10^7
  'a quarter of the way to the Moon',             // 10^8
  'the Moon’s orbit, three times over',           // 10^9
  'seven Suns side by side',                      // 10^10
  'two-thirds of the way to the Sun',             // 10^11
  'past Jupiter, nearly to Saturn',               // 10^12
  'Neptune’s entire orbit',                       // 10^13
  'far beyond every planet and probe',            // 10^14
  'a tenth of a light-year',                      // 10^15
  'one light-year',                               // 10^16
  'ten light-years — a handful of nearby stars',  // 10^17
  'a hundred light-years — as far as our radio signals have reached', // 10^18
  'a thousand light-years — the thickness of the Milky Way’s disk',   // 10^19
  'nearly halfway to the galactic centre',        // 10^20
  'the whole Milky Way',                          // 10^21
  'a million light-years — galaxies become dots', // 10^22
  'ten million light-years — the Local Group and beyond', // 10^23
  'the cosmic web of galaxy filaments',           // 10^24
  'a billion light-years',                        // 10^25
  'about a quarter of the observable universe',   // 10^26
  'the entire observable universe',               // 10^27
];

/* milestone captions, fired when crossing a decade threshold */
const MILESTONES = [
  { log: 1.1,  text:'This is you. 1.8 metres. Hold on.' },
  { log: 5.0,  text:'Every city humanity has ever built fits comfortably in this view.' },
  { log: 7.5,  text:'Every human who has ever lived, lived on this one circle.' },
  { log: 9.3,  text:'The Moon — the farthest any human has ever travelled.' },
  { log: 10.6, text:'Everything humanity has ever built now fits inside a single pixel.' },
  { log: 13.3, text:'Voyager 1 has been flying since 1977. Light out-runs it in 22 hours.' },
  { log: 16.4, text:'Light takes 4.2 years to cross this gap. Voyager 1 would need about 75,000.' },
  { log: 20.8, text:'Every star you have ever seen with your own eyes lives in this small pool of light.' },
  { log: 22.6, text:'Andromeda’s light left it before our species existed.' },
  { log: 26.6, text:'The edge of everything we can ever see — beyond this, light hasn’t had time to reach us.' },
];
let capText = '', capT = 1e9, lastFire = -1e9;

/* ---------------------------------------------------------- formatting */
const SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
const sup = n => String(n).split('').map(c => SUP[c] || c).join('');
const frac = x => ((x % 1) + 1) % 1;
const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function fmtPow(s) {
  let e = Math.floor(Math.log10(s));
  let m = s / Math.pow(10, e);
  if (m >= 9.95) { m = 1; e++; }
  return (Math.abs(m - 1) < 0.05) ? `10${sup(e)} m` : `${m.toFixed(1)}×10${sup(e)} m`;
}
function fmtNice(s) {
  if (s < 1e4)   return `${s < 10 ? s.toFixed(1) : Math.round(s).toLocaleString('en')} m`;
  if (s < 1e10)  return `${sig2(s / 1e3)} km`;
  if (s < 5e14)  return `${sig2(s / AU)} AU`;
  if (s < 1e5 * LY) return `${sig2(s / LY)} light-years`;
  if (s < 1e8 * LY) return `${sig2(s / (1e6 * LY))} million light-years`;
  return `${sig2(s / (1e9 * LY))} billion light-years`;
}
function sig2(v) {
  if (v >= 100) return Math.round(v).toLocaleString('en');
  if (v >= 10)  return v.toFixed(0);
  if (v >= 1)   return v.toFixed(1);
  return v.toFixed(2);
}
function fmtLight(d) {
  const t = d / C_LIGHT;
  if (t < 120)        return `light: ${t.toFixed(1)} s`;
  if (t < 7200)       return `light: ${(t / 60).toFixed(1)} min`;
  if (t < 172800)     return `light: ${(t / 3600).toFixed(0)} h`;
  const yr = t / 3.156e7;
  if (yr < 1e3)  return `light: ${yr < 10 ? yr.toFixed(1) : Math.round(yr).toLocaleString('en')} yr`;
  if (yr < 1e6)  return `light: ${Math.round(yr / 100) / 10}k yr`;
  if (yr < 1e9)  return `light: ${sig2(yr / 1e6)} million yr`;
  return `light: ${sig2(yr / 1e9)} billion yr`;
}

/* ---------------------------------------------------------- starfield */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const LAYERS = [
  { n: 120, speed: 0.14, size: 0.9, alpha: 0.45 },
  { n: 100, speed: 0.30, size: 1.3, alpha: 0.7 },
  { n: 70,  speed: 0.55, size: 1.8, alpha: 1.0 },
];
const rand = mulberry32(20260817);
const STAR_COLORS = ['#cfd6ea', '#cfd6ea', '#cfd6ea', '#8ceedd', '#ffd8a8', '#b9c6ff'];
for (const L of LAYERS) {
  L.stars = [];
  for (let i = 0; i < L.n; i++) {
    L.stars.push({
      ang: rand() * Math.PI * 2,
      u: rand(),
      tw: 1 + rand() * 3,
      ph: rand() * Math.PI * 2,
      col: STAR_COLORS[(rand() * STAR_COLORS.length) | 0],
    });
  }
}
let px = 0, py = 0; // pointer parallax

function drawStars(t) {
  const cx = W / 2, cy = H / 2;
  const R = Math.hypot(W, H) * 0.62;
  for (const L of LAYERS) {
    const drift = logS * L.speed;
    for (const s of L.stars) {
      const u = frac(s.u - drift);
      const rr = Math.sqrt(u) * R;
      const x = cx + Math.cos(s.ang) * rr + px * L.speed * 26;
      const y = cy + Math.sin(s.ang) * rr + py * L.speed * 26;
      const env = Math.min(1, u * 12) * Math.min(1, (1 - u) * 5);
      const twk = 0.7 + 0.3 * Math.sin(t * s.tw + s.ph);
      ctx.globalAlpha = L.alpha * env * twk * 0.85;
      ctx.fillStyle = s.col;
      const sz = L.size * (0.6 + u);
      ctx.beginPath();
      ctx.arc(x, y, sz, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

/* ---------------------------------------------------------- drawing helpers */
function glow(x, y, r, color, alpha, spread) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * (spread || 3));
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = alpha * 0.35;
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r * (spread || 3), 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function label(x, y, name, sub1, sub2, alpha, align) {
  ctx.textAlign = align || 'left';
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#e8e6df';
  ctx.font = '600 13px ui-sans-serif, system-ui, sans-serif';
  ctx.fillText(name, x, y);
  ctx.font = '400 11px ui-sans-serif, system-ui, sans-serif';
  if (sub1) { ctx.fillStyle = '#8a8fa3'; ctx.fillText(sub1, x, y + 15); }
  if (sub2) { ctx.fillStyle = '#8ceedd'; ctx.fillText(sub2, x, y + (sub1 ? 30 : 15)); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawHuman(x, baseY, h, color, alpha) {
  // simple silhouette: head + body capsule
  const headR = h * 0.075;
  const bodyW = h * 0.30;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, baseY - h + headR, headR, 0, Math.PI * 2);
  ctx.fill();
  const top = baseY - h + headR * 2.4;
  const r = bodyW / 2;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x - r, top, bodyW, baseY - top, r);
  else ctx.rect(x - r, top, bodyW, baseY - top);
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* ---------------------------------------------------------- size regime */
function drawSizeMode(alphaMode) {
  if (alphaMode <= 0.01) return;
  const s = Math.pow(10, logS);       // meters per screen-height
  const pxm = H / s;                  // px per meter
  const baseY = H * 0.62;

  // baseline
  ctx.globalAlpha = 0.35 * alphaMode;
  ctx.strokeStyle = '#232b3a';
  ctx.beginPath();
  ctx.moveTo(0, baseY); ctx.lineTo(W, baseY);
  ctx.stroke();
  ctx.globalAlpha = 1;

  for (const o of SIZE_OBJECTS) {
    const u = logS - Math.log10(o.size);
    // fade window: object comfortable when it spans 100%..3% of screen
    let a = smooth(-0.25, 0.05, u) * (1 - smooth(1.25, 1.55, u));
    a *= alphaMode;
    if (a <= 0.01) continue;
    const hpx = o.size * pxm;
    const x = o.x * W;

    if (o.human && hpx > 14) {
      drawHuman(x, baseY, hpx, o.color, a);
    } else {
      const r = Math.max(hpx / 2, 1.6);
      glow(x, baseY - r, r, o.color, a, 2.2);
    }
    const ly = Math.min(baseY - hpx - 26, H * 0.30);
    const anchorY = Math.max(ly, H * 0.16);
    ctx.globalAlpha = a * 0.4;
    ctx.strokeStyle = '#3d4a6b';
    ctx.beginPath();
    ctx.moveTo(x, baseY - hpx - 6);
    ctx.lineTo(x, anchorY + 22);
    ctx.stroke();
    ctx.globalAlpha = 1;
    const align = x > W * 0.55 ? 'right' : 'left';
    label(x + (align === 'left' ? 8 : -8), anchorY, o.name, o.fact, fmtNice(o.size), a, align);
  }
}

/* ---------------------------------------------------------- distance regime */
function drawDistMode(alphaMode) {
  if (alphaMode <= 0.01) return;
  const s = Math.pow(10, logS);
  const pxm = H / s;
  const y0 = H * 0.52;
  const ex = W * (W < 640 ? 0.10 : 0.13);

  // the distance line
  ctx.globalAlpha = 0.4 * alphaMode;
  ctx.strokeStyle = '#232b3a';
  ctx.beginPath();
  ctx.moveTo(ex, y0); ctx.lineTo(W, y0);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // decade ticks along the line (true meters)
  ctx.font = '400 10px ui-sans-serif, system-ui, sans-serif';
  for (let k = 6; k <= 27; k++) {
    const dpx = Math.pow(10, k) * pxm;
    if (dpx < 50 || dpx > W * 1.05) continue;
    const x = ex + dpx;
    if (x > W - 8) continue;
    ctx.globalAlpha = 0.5 * alphaMode;
    ctx.strokeStyle = '#3d4a6b';
    ctx.beginPath();
    ctx.moveTo(x, y0 - 5); ctx.lineTo(x, y0 + 5);
    ctx.stroke();
    ctx.globalAlpha = 0.55 * alphaMode;
    ctx.fillStyle = '#8a8fa3';
    ctx.textAlign = 'center';
    ctx.fillText(`10${sup(k)} m`, x, y0 + 20);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';

  // Earth at the origin
  const er = Math.max(6.371e6 * pxm, 3);
  glow(ex, y0, Math.min(er, H), '#6ea8ff', alphaMode, 2.4);
  label(ex, y0 + Math.min(er, H * 0.3) + 22, 'Earth', 'you are here', null, alphaMode * 0.9, 'center');

  // objects at true distance
  for (const o of DIST_OBJECTS) {
    const dpx = o.d * pxm;
    const lg = Math.log10(dpx / H);
    let a = smooth(-1.45, -0.95, lg) * (1 - smooth(0.15, 0.6, lg));
    a *= alphaMode;
    if (a <= 0.01) continue;
    const x = ex + dpx;
    if (x > W + 60) continue;
    const r = Math.max(o.r * pxm, 2.4);
    glow(x, y0, Math.min(r, H * 0.8), o.color, a, 3);

    const above = o.side < 0;
    const yl = above ? y0 - H * 0.135 : y0 + H * 0.115;
    ctx.globalAlpha = a * 0.4;
    ctx.strokeStyle = '#3d4a6b';
    ctx.beginPath();
    ctx.moveTo(x, y0 + (above ? -8 : 8));
    ctx.lineTo(x, above ? yl + 14 : yl - 14);
    ctx.stroke();
    ctx.globalAlpha = 1;
    const align = x > W * 0.72 ? 'right' : 'left';
    const lx = x + (align === 'left' ? 6 : -6);
    const light = o.lightNote ? o.lightNote : fmtLight(o.d);
    label(lx, above ? yl - 30 : yl, o.name, o.fact, `${fmtNice(o.d)} · ${light}`, a, align);
  }
}

/* ---------------------------------------------------------- "you are here" marker */
function drawYouMarker(t, sizeA, distA) {
  const s = Math.pow(10, logS);
  const hFrac = 1.8 / s;
  let x, y;
  if (sizeA > distA) { x = 0.38 * W; y = H * 0.62; }
  else { x = W * (W < 640 ? 0.10 : 0.13); y = H * 0.52; }
  const pulse = 4 + 2.5 * Math.sin(t * 2.2);
  if (hFrac < 0.008) {
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#6ea8ff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y, pulse + 5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#6ea8ff';
    ctx.beginPath();
    ctx.arc(x, y, 1.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  // HUD line
  if (hFrac > 0.02) {
    elYou.textContent = '▲ you, to scale — 1.8 m';
  } else {
    const n = Math.round(Math.log10(s / 1.8));
    elYou.textContent = `you are now 10${sup(-n)} of this view`;
  }
}

/* ---------------------------------------------------------- HUD + captions */
function updateHUD() {
  const s = Math.pow(10, logS);
  elScale.textContent = fmtPow(s);
  elUnit.textContent = `one screen ≈ ${fmtNice(s)}`;
  const idx = Math.max(0, Math.min(DECADE_CMP.length - 1, Math.floor(logS) + 1));
  elCmp.textContent = DECADE_CMP[idx];
}

function checkMilestones(now) {
  let fired = null;
  for (const m of MILESTONES) {
    if ((prevLogS < m.log && logS >= m.log) || (prevLogS > m.log && logS <= m.log)) fired = m;
  }
  if (fired && now - lastFire > 6) {
    capText = fired.text;
    elCap.textContent = capText;
    capT = 0;
    lastFire = now;
  }
}

/* ---------------------------------------------------------- input */
let interacted = false;
function poke() {
  if (!interacted) { interacted = true; elHint.style.opacity = '0'; }
}

window.addEventListener('wheel', e => {
  e.preventDefault();
  poke();
  target = clampLog(target + e.deltaY * 0.0021);
}, { passive: false });

const pointers = new Map();
let pinchBase = null, dragY = null;

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchBase = { dist: Math.hypot(a.x - b.x, a.y - b.y), target };
    dragY = null;
  } else {
    dragY = e.clientY;
  }
});
canvas.addEventListener('pointermove', e => {
  px = (e.clientX / W - 0.5) * 2;
  py = (e.clientY / H - 0.5) * 2;
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  poke();
  if (pointers.size === 2 && pinchBase) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d > 0 && pinchBase.dist > 0) {
      target = clampLog(pinchBase.target - Math.log10(d / pinchBase.dist) * 2.4);
    }
  } else if (dragY !== null) {
    target = clampLog(target + (e.clientY - dragY) * 0.0075);
    dragY = e.clientY;
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchBase = null;
  if (pointers.size === 0) dragY = null;
  else if (pointers.size === 1) dragY = [...pointers.values()][0].y;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

window.addEventListener('keydown', e => {
  const step = 0.5;
  if (e.key === 'ArrowUp' || e.key === '-' || e.key === 'ArrowRight') { target = clampLog(target + step); poke(); }
  if (e.key === 'ArrowDown' || e.key === '+' || e.key === '=' || e.key === 'ArrowLeft') { target = clampLog(target - step); poke(); }
});

/* slider */
const SLIDER_LABELS = [
  [0, '1 m'], [3, '1 km'], [6, '10⁶ m'], [15.976, '1 ly'], [22.489, '1 Mpc'],
];
(function buildTicks() {
  for (let k = LOG_MIN; k <= LOG_MAX; k++) {
    const t = document.createElement('div');
    t.className = 'tick' + (k % 3 === 0 ? ' major' : '');
    t.style.left = `${((k - LOG_MIN) / (LOG_MAX - LOG_MIN)) * 100}%`;
    elTrack.appendChild(t);
  }
  for (const [lg, txt] of SLIDER_LABELS) {
    const l = document.createElement('div');
    l.className = 'tlabel';
    l.style.left = `${((lg - LOG_MIN) / (LOG_MAX - LOG_MIN)) * 100}%`;
    l.textContent = txt;
    elTrack.appendChild(l);
  }
})();
let sliding = false;
function sliderSet(e) {
  const r = elTrack.getBoundingClientRect();
  const f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  target = LOG_MIN + f * (LOG_MAX - LOG_MIN);
}
elTrack.addEventListener('pointerdown', e => {
  sliding = true;
  elTrack.setPointerCapture(e.pointerId);
  poke();
  sliderSet(e);
});
elTrack.addEventListener('pointermove', e => { if (sliding) sliderSet(e); });
elTrack.addEventListener('pointerup', () => { sliding = false; });
elTrack.addEventListener('pointercancel', () => { sliding = false; });

/* ---------------------------------------------------------- main loop */
let lastT = performance.now();
function frame(nowMs) {
  const now = nowMs / 1000;
  let dt = Math.min((nowMs - lastT) / 1000, 0.1);
  lastT = nowMs;

  prevLogS = logS;
  logS += (target - logS) * Math.min(1, dt * 5.5);
  if (Math.abs(target - logS) < 1e-4) logS = target;

  // background
  ctx.fillStyle = '#07080c';
  ctx.fillRect(0, 0, W, H);
  drawStars(now);

  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.6);
  vg.addColorStop(0, 'rgba(7,8,12,0)');
  vg.addColorStop(1, 'rgba(3,4,7,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // regimes crossfade around 10^7.6..10^8.2 m
  const dm = smooth(7.6, 8.2, logS);
  drawSizeMode(1 - dm);
  drawDistMode(dm);
  drawYouMarker(now, 1 - dm, dm);

  updateHUD();
  checkMilestones(now);

  // caption fade: in .6s, hold 3.6s, out 1.2s
  capT += dt;
  let ca = 0;
  if (capT < 0.6) ca = capT / 0.6;
  else if (capT < 4.2) ca = 1;
  else if (capT < 5.4) ca = 1 - (capT - 4.2) / 1.2;
  elCap.style.opacity = ca.toFixed(3);

  // slider thumb
  const f = (logS - LOG_MIN) / (LOG_MAX - LOG_MIN);
  elThumb.style.left = `${f * 100}%`;
  elFill.style.width = `${f * 100}%`;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
